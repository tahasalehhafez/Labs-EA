# A hash sign starts a comment in nginx configuration.
# This tiny server pretends to be NorthlineCore, the 2011 system.

server {
  # Listen on the normal web port inside the container.
  listen 80;

  # Answer every address that reaches this server.
  location / {
    # Say the answer is JSON, so the browser shows it as text.
    default_type application/json;
    # Send back a fixed answer that clearly says who replied.
    return 200 '{"system":"NorthlineCore","note":"the old 2011 system answered this request"}';
  }
}