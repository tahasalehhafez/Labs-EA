# This file lists every container that makes up our system.
services:

  # Our own Catalog service. Unchanged from before.
  catalog:
    build: ./services/catalog
    container_name: northline-catalog
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
    restart: unless-stopped

  # The event log. Unchanged from before.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: northline-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr=INTERNAL://redpanda:29092,EXTERNAL://localhost:9092
    ports:
      - "9092:9092"
    restart: unless-stopped

  # NEW: the warehouse. It listens all day, so it starts with everything else.
  warehouse:
    build: ./services/warehouse
    container_name: northline-warehouse
    environment:
      # Tell it where the event log is, using the service name on the private network.
      KAFKA_BROKER: "redpanda:29092"
    # Do not start this until redpanda has been created.
    depends_on:
      - redpanda
    restart: unless-stopped

  # NEW: the checkout publisher. It runs once, prints, and stops.
  checkout:
    build: ./services/checkout
    environment:
      KAFKA_BROKER: "redpanda:29092"
    depends_on:
      - redpanda
    # A profile means "do not start this with everything else".
    # We will start it by hand, only when we want to send events.
    profiles:
      - manual