# A hash sign starts a comment. The computer ignores these lines.
# This file lists every container that makes up our system.

# Everything below "services" is one running piece of software.
services:

  # Our own Catalog service.
  catalog:
    # Build an image from the Dockerfile in this folder, instead of downloading one.
    build: ./services/catalog
    # Give the running container a fixed, readable name.
    container_name: northline-catalog
    # Connect port 8080 on your laptop to port 8080 inside the container.
    # The left number is your laptop. The right number is inside the box.
    ports:
      - "8080:8080"
    # Values handed to the program when it starts.
    environment:
      # Which port the program should listen on.
      PORT: "8080"
    # If the container stops because of a crash, start it again.
    restart: unless-stopped

  # The event log. It speaks the Kafka protocol but is one small container.
  redpanda:
    # The official Redpanda image.
    image: docker.redpanda.com/redpandadata/redpanda:latest
    # A readable name for the running container.
    container_name: northline-redpanda
    # The exact start-up options. Each line is one option.
    command:
      # Start the broker.
      - redpanda
      - start
      # Use one CPU core. Enough for a laptop.
      - --smp=1
      # Tell Redpanda it is sharing the machine, so it does not grab everything.
      - --overprovisioned
      # This is the only broker, so its id is zero.
      - --node-id=0
      # Skip the production readiness checks. This is a laptop, not a data centre.
      - --check=false
      # Listen on two doors: one for other containers, one for your laptop.
      - --kafka-addr=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      # Tell clients which address to come back to for each door.
      # Other containers use the name "redpanda". Your laptop uses "localhost".
      - --advertise-kafka-addr=INTERNAL://redpanda:29092,EXTERNAL://localhost:9092
    # Open the external door to your laptop.
    ports:
      - "9092:9092"
    # Restart it if it crashes.
    restart: unless-stopped