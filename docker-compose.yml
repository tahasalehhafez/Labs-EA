# This file lists every container that makes up our system.
services:

  # The Catalog service. It can now be run as several copies.
  catalog:
    build: ./services/catalog
    # NOTE: container_name has been removed on purpose.
    # A fixed name can only belong to one container, so it blocks copies.
    # A range of ports. Copy one gets 8080, copy two gets 8081, copy three 8082.
    ports:
      - "8080-8082:8080"
    environment:
      PORT: "8080"
      # Start in the wrong mode on purpose, so we can see the problem.
      SESSION_STORE: "redis"
      # Where Redis is, ready for when we switch over.
      REDIS_URL: "redis://redis:6379"
    depends_on:
      - redis
    restart: unless-stopped

  # NEW: Redis. A small, very fast shared store for session data.
  redis:
    image: redis:7-alpine
    container_name: northline-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # The event log. Unchanged.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: northline-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr=INTERNAL://redpanda:29092,EXTERNAL://localhost:9092
    ports:
      - "9092:9092"
    restart: unless-stopped

  # The warehouse listener. Unchanged.
  warehouse:
    build: ./services/warehouse
    container_name: northline-warehouse
    environment:
      KAFKA_BROKER: "redpanda:29092"
    depends_on:
      - redpanda
    restart: unless-stopped

  # The checkout publisher. Unchanged. Started by hand only.
  checkout:
    build: ./services/checkout
    environment:
      KAFKA_BROKER: "redpanda:29092"
    depends_on:
      - redpanda
    profiles:
      - manual


  # The gateway. It is the only door the shopper knocks on.
  gateway:
    # The official small nginx image. We add no code, only configuration.
    image: nginx:alpine
    container_name: northline-gateway
    # Your laptop port 8000 connects to port 80 inside the container.
    ports:
      - "8000:80"
    # Show our config file to nginx. ro means read-only, so nginx cannot change it.
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - catalog
      - legacy
    restart: unless-stopped

  # The stand-in for the old 2011 system.
  legacy:
    image: nginx:alpine
    container_name: northline-legacy
    volumes:
      - ./gateway/legacy.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped